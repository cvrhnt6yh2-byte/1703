<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ECECEA">
<title>Hub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
:root{--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.4,.5,1)}
html[data-theme="light"]{
  --bg:#ECECEA;--card:#FFFFFF;--card2:#F4F4F3;--text:#111;--muted:#8A8A87;--faint:rgba(17,17,17,.1);
  --acc:#5FCB9F;--acc-ink:#1E8A62;--lav:#A68BD6;--dot:rgba(17,17,17,.13);--shadow:0 0 0 1px rgba(0,0,0,.05),0 24px 48px -28px rgba(0,0,0,.28)}
html[data-theme="dark"]{
  --bg:#0B0B0B;--card:#151514;--card2:#1C1C1B;--text:#EDEBE6;--muted:#7E7C77;--faint:rgba(255,255,255,.08);
  --acc:#93DDB9;--acc-ink:#93DDB9;--lav:#BBA6E6;--dot:rgba(255,255,255,.07);--shadow:0 0 0 1px rgba(255,255,255,.05),0 24px 48px -28px rgba(0,0,0,.8)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{min-height:100dvh;color:var(--text);font-family:'Onest',-apple-system,sans-serif;
  padding:calc(22px + env(safe-area-inset-top,0px)) 16px calc(26px + env(safe-area-inset-bottom,0px));
  max-width:520px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;transition:background-color .4s}
#halftone{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;display:flex;flex-direction:column;flex:1;justify-content:center}
.in{opacity:0;transform:translateY(14px);animation:rise .8s var(--ease) forwards}
@keyframes rise{to{opacity:1;transform:none}}

/* ---- приложения ---- */
h2{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 6px 10px;text-align:center}
a.card{display:block;text-decoration:none;color:var(--text);background:var(--card);border-radius:28px;padding:18px 18px 16px;
  margin-bottom:10px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .35s var(--spring)}
a.card:active{transform:scale(.97);transition-duration:.12s}
.k-top{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.k-top .tag{display:flex;align-items:center;gap:6px}
.k-top .tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.mark{font-size:44px;font-weight:700;letter-spacing:-.04em;margin:14px 0 2px;line-height:1;font-variant-numeric:tabular-nums}
.mark .x{color:var(--muted)}
.desc{font-size:13.5px;color:var(--muted);font-weight:500}
.k-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding-top:12px;border-top:1px solid var(--faint)}
.k-stat{font-size:12.5px;font-weight:600;min-height:16px}
.k-stat small{display:block;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.bar{height:4px;border-radius:2px;background:var(--faint);overflow:hidden;margin-top:7px;width:120px}
.bar i{display:block;height:100%;width:0;background:var(--c);border-radius:2px;transition:width 1.2s var(--ease) .5s}
.go{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;background:var(--text);color:var(--card)}
.go svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.c-1703{--c:var(--acc)} .c-1q84{--c:var(--lav)}
.glyph{position:absolute;right:-6px;top:-8px;font-size:120px;font-weight:700;letter-spacing:-.06em;color:var(--text);opacity:.035;pointer-events:none;line-height:1}
footer{padding-top:22px;text-align:center;font-size:10px;font-weight:600;letter-spacing:.24em;color:var(--muted);opacity:.7}
@media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1;transform:none}}
</style>
</head>
<body>

<canvas id="halftone"></canvas>
<div class="wrap">

<h2 class="in" style="animation-delay:.1s">Выбери приложение</h2>

<a class="card c-1703 in" style="animation-delay:.22s" href="workout.html">
  <span class="glyph">17</span>
  <div class="k-top"><span class="tag">Тренировки</span><span id="w-prog"></span></div>
  <div class="mark" id="mark1703"><span class="w">17</span><span class="x">03</span></div>
  <div class="desc">Программа, веса, прогресс</div>
  <div class="k-foot">
    <div class="k-stat"><small>Сегодня</small><span id="w-next">Открыть программу</span><div class="bar"><i id="w-bar"></i></div></div>
    <span class="go"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
  </div>
</a>

<a class="card c-1q84 in" style="animation-delay:.32s" href="1q84.html">
  <span class="glyph">84</span>
  <div class="k-top"><span class="tag">Привычки</span><span id="q-streak"></span></div>
  <div class="mark" id="mark1q84"><span class="w">1Q</span><span class="x">84</span></div>
  <div class="desc">Рутина, календарь, статистика</div>
  <div class="k-foot">
    <div class="k-stat"><small>Сегодня</small><span id="q84today">Отметь первую привычку</span><div class="bar"><i id="q-bar"></i></div></div>
    <span class="go"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
  </div>
</a>

<footer class="in" style="animation-delay:.45s">BY NIKOLAI</footer>
</div>

<script>
const TG = window.Telegram && Telegram.WebApp;
try{ TG && TG.ready(); TG && TG.expand(); }catch(e){}
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const isoOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

function readJSON(k){ try{ const r=localStorage.getItem(k); return r?JSON.parse(r):null; }catch(e){ return null; } }
function workoutData(){
  let uid='local'; try{ uid = (TG && TG.initDataUnsafe && TG.initDataUnsafe.user && TG.initDataUnsafe.user.id) || 'local'; }catch(e){}
  let d = readJSON('tp1703_'+uid);
  if (!d){ try{ for (let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if (/^tp1703_/.test(k)){ d=readJSON(k); if (d) break; } } }catch(e){} }
  return d;
}

/* ---- тема: как в приложении, которое открывали последним ---- */
function appTheme(app){
  const d = app==='1q84' ? readJSON('1q84_v1') : workoutData();
  return d && (d.theme==='light'||d.theme==='dark') ? d.theme : null;
}
function syncTheme(){
  let last = null; try{ last = localStorage.getItem('hub_last'); }catch(e){}
  let t = appTheme(last==='1q84' ? '1q84' : '1703') || appTheme(last==='1q84' ? '1703' : '1q84');
  if (!t && TG && TG.colorScheme) t = TG.colorScheme;
  t = t || 'light';
  document.documentElement.setAttribute('data-theme', t);
  const bg = t==='dark' ? '#0B0B0B' : '#ECECEA';
  document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
  try{ TG && TG.setHeaderColor && TG.setHeaderColor(bg); TG && TG.setBackgroundColor && TG.setBackgroundColor(bg); }catch(e){}
  if (HT && HT.ctx) htDraw(performance.now());
}

/* ---- фон как на прелоадере: полутоновая рамка, гуще к краям ---- */
const HT = { c: document.getElementById('halftone'), seed: Array.from({length:64}, ()=>Math.random()), t0: performance.now() };
function htInit(){ const dpr = Math.min(2, devicePixelRatio||1); HT.w = innerWidth; HT.h = innerHeight;
  HT.c.width = HT.w*dpr; HT.c.height = HT.h*dpr; HT.ctx = HT.c.getContext('2d'); HT.ctx.setTransform(dpr,0,0,dpr,0,0); }
function noise(x,y){ const s=HT.seed, xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi, h=(a,b)=>s[((a*7+b*13)%64+64)%64];
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf), a=h(xi,yi), b=h(xi+1,yi), c=h(xi,yi+1), d=h(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }
function htDraw(now){
  const ctx=HT.ctx, W=HT.w, H=HT.h, cell=5, t=(now-HT.t0)/4000, m=Math.min(W,H);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = document.documentElement.getAttribute('data-theme')==='dark' ? '#2E2E2C' : '#B4B4B1';
  for (let y=0;y<H;y+=cell) for (let x=0;x<W;x+=cell){
    const dEdge = Math.min(x,y,W-x,H-y)/(m*.42), n = noise(x/90+t, y/90-t*.6), dens = .95 - dEdge*1.7 + (n-.5)*.8;
    if (dens<=0) continue;
    const thr = ((x/cell)%2 + 2*((y/cell)%2))/4 + .12;
    if (dens>thr){ const s = dens>1.05?3:2; ctx.fillRect(x,y,s,s); }
  }
}
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
htInit(); let htLast = 0;
(function loop(now){ if (now-htLast>=40 || !htLast){ htLast=now||1; htDraw(now||performance.now()); } if (!REDUCED) requestAnimationFrame(loop); })(performance.now());
addEventListener('resize', ()=>{ htInit(); htDraw(performance.now()); });

/* ---- карточка 1703 ---- */
function workoutCard(){
  const w = workoutData(); if (!w) return;
  const today = isoOf(new Date());
  const doneToday = (w.history||[]).some(h=>h.date===today);
  if (w.program==='aomame'){
    $('#w-prog').textContent = 'Aomame';
    $('#w-next').textContent = doneToday ? 'Сегодня уже тренировалась ✓' : 'Следующая · тренировка '+(w.aWorkout||1);
  } else {
    $('#w-prog').textContent = 'Tengo';
    const wk = w.week||1, wo = w.workout||1;
    $('#w-next').textContent = doneToday ? 'Тренировка сделана ✓' : (wk>=10 ? 'Неделя 10 · проходка' : 'Неделя '+wk+' · тренировка '+wo);
  }
  const wk = Math.min(10, w.week||1);
  $('#w-bar').style.width = (w.program==='aomame' ? ((w.aWorkout||1)/3*100) : (wk/10*100))+'%';
}

/* ---- карточка 1Q84 ---- */
function q84Card(){
  const st = readJSON('1q84_v1'); if (!st || !Array.isArray(st.trackers) || !st.trackers.length) return;
  const day = (st.entries && st.entries[isoOf(new Date())]) || {};
  const done = st.trackers.filter(t=>day[t.id]!==undefined).length, all = st.trackers.length;
  $('#q84today').textContent = done===all ? 'Все '+all+' отмечены ✓' : 'Отмечено '+done+' из '+all;
  $('#q-bar').style.width = (done/all*100)+'%';
  // серия дней, когда отмечено хоть что-то
  let n=0; const d=new Date(); if (!Object.keys(day).length) d.setDate(d.getDate()-1);
  while (n<400){ const e = st.entries && st.entries[isoOf(d)]; if (!e || !Object.keys(e).length) break; n++; d.setDate(d.getDate()-1); }
  if (n>1) $('#q-streak').textContent = n+' дн. подряд';
}

/* ---- «слот-машина» на логотипах ---- */
function slot(el, final, delay){
  const pool = c => /[0-9]/.test(c) ? '0123456789' : 'QWXKZJVRTY';
  const start = performance.now()+delay, DUR = 800, ease = t => 1-Math.pow(1-t,4); let last = 0;
  el.textContent = final.replace(/./g,'0');
  (function f(now){
    if (now<start) return requestAnimationFrame(f);
    const t = Math.min(1,(now-start)/DUR);
    if (now-last >= 16+200*ease(t)){ last = now; const lock = Math.floor(final.length*ease(t)*1.15);
      el.textContent = [...final].map((c,i)=> i<lock||t>=1 ? c : pool(c)[Math.random()*10|0]).join(''); }
    if (t<1) requestAnimationFrame(f); else el.textContent = final;
  })(performance.now());
}

function refresh(){ syncTheme(); workoutCard(); q84Card(); }
refresh();
window.addEventListener('pageshow', refresh);
window.addEventListener('storage', refresh);
document.querySelectorAll('a.card').forEach(a=>a.addEventListener('click',()=>{
  try{ localStorage.setItem('hub_last', a.getAttribute('href')==='1q84.html' ? '1q84' : '1703'); }catch(e){}
  try{ TG && TG.HapticFeedback && TG.HapticFeedback.impactOccurred('light'); }catch(e){} }));
if (!REDUCED){
  slot($('#mark1703 .w'),'17',250); slot($('#mark1703 .x'),'03',350);
  slot($('#mark1q84 .w'),'1Q',420); slot($('#mark1q84 .x'),'84',520);
}
</script>
</body>
</html>
